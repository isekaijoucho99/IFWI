experiment_name: prior_normalized_charbonnier
description: Normalized deep horizontal charbonnier prior; fixed 1000 m/s scale
model:
  network_type: vanilla
  neuron:
  - 2
  - 256
  - 256
  - 256
  - 256
  - 1
  omega_0: 30
  activation: sine
  dropout: false
  prob: 0.2
  outermost_linear: true
  bias: true
loss:
  type: combined
  use_prior: true
  lambda_prior: 0.1
  velocity_range:
  - 1500.0
  - 5500.0
  prior_params:
    deep_start: 0.5
    monotonic_weight: 0.0
    horizontal_weight: 0.1
    range_weight: 1.0
    velocity_scale: 1000.0
    prior_form: charbonnier
    charbonnier_eps: 0.001
optimizer:
  optimizer_type: adam
  learning_rate: 0.0001
  use_scheduler: false
training:
  max_iterations: 4000
  log_interval: 100
  alpha: 0
  clip_grad: null
data:
  model_file: vel_marmousi_376x1151.csv
  downsample: 4
  noise_level: 0.0
  dz: 15
  dt: 0.0019
  nt: 1000
evaluation:
  depth_threshold: 0.5
  corner_size: 0.25
  save_plots: true
gradient_preconditioner:
  enabled: false
