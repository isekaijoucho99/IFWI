experiment_name: combined_best
description: 'Candidate combination (not established best): attention + preconditioner
  + layerwise LR; no prior'
model:
  network_type: attention
  neuron:
  - 2
  - 256
  - 256
  - 256
  - 256
  - 1
  omega_0: 30
  activation: sine
  dropout: false
  prob: 0.2
  outermost_linear: true
  bias: true
  use_attention: true
  attention_hidden: 64
  deep_bias: 2.0
loss:
  type: standard_mse
  use_prior: false
optimizer:
  optimizer_type: layerwise_lr
  learning_rate: 0.0001
  use_scheduler: false
  lr_deep: 0.0005
  deep_threshold: 0.5
training:
  max_iterations: 4000
  log_interval: 100
  alpha: 0
  clip_grad: null
data:
  model_file: vel_marmousi_376x1151.csv
  downsample: 4
  noise_level: 0.0
  dz: 15
  dt: 0.0019
  nt: 1000
evaluation:
  depth_threshold: 0.5
  corner_size: 0.25
  save_plots: true
gradient_preconditioner:
  enabled: true
  weight_type: piecewise
  deep_start: 0.5
  deep_weight: 2.0
  bottom_weight: 5.0
