# LR-IFWI paper protocol (Chen et al. 2025, TGRS 63, 5918816, Sec. II-E and III-A/B):
# absolute velocity m = mean + std * network (mu = 3, xi = 1 km/s), Stage-1 pretraining on
# the Gaussian smooth initial model, 13 shots at 300 m, 8 Hz, dt 1.9 ms, 1000 samples, all shots per update, Adam lr 1e-4,
# 1000 epochs (smooth initial model). LR-IFWI arm: rank 50/100, two 3 x 128 sine factor
# MLPs, omega_0 30, SIREN-normalized coordinates, random core C. Only experiment_name
# and the model section differ from lrpaper13_ifwi.
# Not given by the paper: Gaussian sigma (kept at 15 cells as in all residual runs),
# pretraining updates/lr, the distribution of the random core C.
# LR-IFWI arm with FR + trainable omega in both factor networks (FR-IFWI Sec. 4.6 proposes
# reparameterizing the LR-IFWI factor INRs). Only experiment_name and the fourier/trainable_omega
# entries differ from lrpaper13_lr_ifwi.
experiment_name: lrpaper13_lr_fr_ifwi
parameterization: absolute
seed: 3
data:
  model_file: vel_marmousi_376x1151.csv
  model_units: m/s
  csv_header: legacy
  downsample: 4
  crop_shape: null
  grid_spacing_m: 15.0
initialization:
  sigma: 15.0
  gaussian_mode: reflect
  gaussian_truncate: 4.0
  # Stage 1 (Sec. II-E): fit the network to the Gaussian initial model before inversion.
  # The paper gives no pretraining updates or lr; these follow pretrain_marmousi.py
  # (original IFWI: Adam 1e-4, 5000 updates, keep the lowest-loss state).
  pretrain:
    updates: 5000
    learning_rate: 0.0001
model:
  # The 2-D SIREN is replaced by the factor networks: m_hat = U C V^T (Eq. 7).
  neurons: null
  omega_0: 30.0
  mean_kmps: 3.0
  std_kmps: 1.0
  # FR hidden layers (W = Lambda B) as in paper13_fr_ifwi (FR-INR 2d_image_fitting.py, sine).
  fourier:
    high_freq_num: 128
    low_freq_num: 128
    phi_num: 32
    alpha: 0.01
    lambda_init: fr_inr
  # Per-layer trainable sine omega (FR-IFWI Sec. 3.2), init omega_0, lr ours; it also trains
  # during Stage-1 pretraining (all parameters are pretrained).
  trainable_omega:
    learning_rate: 0.01
  low_rank:
    rank_z: 50          # r1, depth (n1 = 94)
    rank_x: 100         # r2, lateral (n2 = 288)
    hidden: [128, 128, 128]
    coordinates: normalized  # SIREN default grid linspace(-1, 1, n); Eq. 6 indices 1..n superseded, see docs/lr_ifwi.md
    coord_scale: 1.0
    core_init: random   # paper: random; ours: U(+-1/sqrt(rank_x))
    output_gain: 1.0    # no extra gain in the paper
acquisition:
  num_shots: 13
  source_x_indices: null
  source_start_index: 20
  source_spacing_index: 20
  source_end_margin: 10
  # Original IFWI code geometry, as in all earlier runs (docs/original_notes.md). The IFWI and
  # LR-IFWI papers state sources at 30 m and receivers on the surface; the authors' code uses
  # 15 m / 30 m, and LR-IFWI ran IFWI from that code.
  source_depth_index: 1
  receiver_depth_index: 2
  receiver_stride: 1
forward:
  dt_s: 0.0019
  nt: 1000
  frequency_hz: 8.0
  npad: 15
  order: 2
  free_surface: true
  pml_reflection: 0.000001
training:
  epochs: 1000
  learning_rate: 0.0001
  checkpoint_interval: 50
  shot_batch_size: null
