experiment_name: st_space
description: Experimental scheduled band and bounded residual attention probe
model:
  network_type: vanilla
  neuron:
  - 2
  - 256
  - 256
  - 256
  - 256
  - 1
  omega_0: 30
  activation: sine
  dropout: false
  prob: 0.2
  outermost_linear: true
  bias: true
loss:
  type: standard_mse
  use_prior: false
optimizer:
  optimizer_type: adam
  learning_rate: 0.0001
  use_scheduler: false
training:
  max_iterations: 100
  log_interval: 10
  alpha: 0
  clip_grad: null
data:
  model_file: vel_marmousi_376x1151.csv
  downsample: 4
  noise_level: 0.0
  dz: 15
  dt: 0.0019
  nt: 1000
evaluation:
  depth_threshold: 0.5
  corner_size: 0.25
  save_plots: true
gradient_preconditioner:
  enabled: false

spatiotemporal:
  enabled: true
  schedule_steps: [30, 70]
  cutoffs_hz: [5.0, 8.0, null]
  time_attention: false
  spatial_attention: true
  time_window: 64
  time_strength: 0.3
  spatial_strength: 0.25
  spatial_depth_bias: 0.25
  ramp_steps: 10
