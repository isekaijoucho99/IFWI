base:
  experiment_name: residual_ifwi_stage1
  parameterization: residual
  seed: 3
  data:
    model_file: natural_gradient/tiny_velocity.csv
    model_units: m/s
    csv_header: none
    downsample: 1
    crop_shape: null
    grid_spacing_m: 15.0
  initialization:
    sigma: 1.0
    gaussian_mode: reflect
    gaussian_truncate: 4.0
  model:
    neurons:
    - 2
    - 8
    - 8
    - 1
    omega_0: 30.0
    mean_kmps: 3.0
    std_kmps: 1.0
  acquisition:
    num_shots: 3
    source_x_indices:
    - 1
    - 5
    - 9
    source_start_index: 20
    source_spacing_index: 20
    source_end_margin: 10
    source_depth_index: 1
    receiver_depth_index: 2
    receiver_stride: 1
  forward:
    dt_s: 0.001
    nt: 24
    frequency_hz: 60.0
    npad: 3
    order: 2
    free_surface: true
    pml_reflection: 1.0e-06
  training:
    epochs: 2
    learning_rate: 0.0001
    checkpoint_interval: 1
    shot_batch_size: 2
    shots_per_update: 2
optimizer:
  kind: adam
  damping: 0.1
  step_size: 0.01
  cg_max_iter: 3
  cg_rtol: 0.001
evaluation_interval: 1
