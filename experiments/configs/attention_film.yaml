experiment_name: attention_film
description: Identity initialized feature_film attention only
model:
  network_type: attention
  neuron:
  - 2
  - 256
  - 256
  - 256
  - 256
  - 1
  omega_0: 30
  activation: sine
  dropout: false
  prob: 0.2
  outermost_linear: true
  bias: true
  use_attention: true
  attention_hidden: 64
  attention_type: feature_film
  attention_strength: 0.5
  attention_shift_strength: 0.1
loss:
  type: standard_mse
  use_prior: false
optimizer:
  optimizer_type: adam
  learning_rate: 0.0001
  use_scheduler: false
training:
  max_iterations: 4000
  log_interval: 100
  alpha: 0
  clip_grad: null
data:
  model_file: vel_marmousi_376x1151.csv
  downsample: 4
  noise_level: 0.0
  dz: 15
  dt: 0.0019
  nt: 1000
evaluation:
  depth_threshold: 0.5
  corner_size: 0.25
  save_plots: true
gradient_preconditioner:
  enabled: false
