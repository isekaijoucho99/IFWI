# FR-IFWI paper protocol (Kang et al. 2025, Sec. 3.1/3.2): 13 shots at 300 m, source 15 m deep,
# receivers every grid point, 8 Hz, dt 1.9 ms, 1000 samples, all shots per update, smooth
# Gaussian initial model, 1000 updates (Table 1). Not given by the paper: optimizer/lr, Gaussian
# sigma, network size; these keep the residual stage-1 values (Adam 1e-4, sigma 15, 4x128).
experiment_name: paper13_fr_ifwi_muon
parameterization: residual
seed: 3
data:
  model_file: vel_marmousi_376x1151.csv
  model_units: m/s
  csv_header: legacy
  downsample: 4
  crop_shape: null
  grid_spacing_m: 15.0
initialization:
  sigma: 15.0
  gaussian_mode: reflect
  gaussian_truncate: 4.0
model:
  neurons: [2, 128, 128, 128, 128, 1]
  omega_0: 30.0
  mean_kmps: 3.0
  std_kmps: 1.0
  # FR hidden layers (W = Lambda B); values from FR-INR 2d_image_fitting.py (sine).
  fourier:
    high_freq_num: 128
    low_freq_num: 128
    phi_num: 32
    alpha: 0.01
    lambda_init: fr_inr
  # Per-layer trainable sine omega (FR-IFWI Sec. 3.2), init omega_0; lr is ours (paper gives none).
  trainable_omega:
    learning_rate: 0.01
acquisition:
  num_shots: 13
  source_x_indices: null
  source_start_index: 20
  source_spacing_index: 20
  source_end_margin: 10
  source_depth_index: 1
  receiver_depth_index: 2
  receiver_stride: 1
forward:
  dt_s: 0.0019
  nt: 1000
  frequency_hz: 8.0
  npad: 15
  order: 2
  free_surface: true
  pml_reflection: 0.000001
training:
  epochs: 1000
  learning_rate: 0.0001
  # Muon (McGinnis et al. 2026; Jordan et al. 2024) on the hidden weight matrices (FR: the
  # coefficient matrices lamb); Adam with learning_rate above on inputs, heads, biases and
  # omega, as in the paper's hybrid setup. Muon lr set by matching the velocity change of
  # Adam with experiments/update_response_report.py (docs/muon_ifwi.md); sweep around it.
  # lr 1e-2: 20-step velocity change matches FR13 with Adam (204 vs 216 m/s); Muon removes
  # Adam's ~6x FR step amplification, so 1e-3 moves velocity ~2.6x less (docs/muon_ifwi.md).
  optimizer:
    name: muon
    learning_rate: 0.01
    momentum: 0.95
    nesterov: true
    ns_steps: 5
  checkpoint_interval: 50
  shot_batch_size: null
