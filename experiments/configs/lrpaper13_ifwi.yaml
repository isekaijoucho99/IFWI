# LR-IFWI paper protocol (Chen et al. 2025, TGRS 63, 5918816, Sec. II-E and III-A/B):
# absolute velocity m = mean + std * network (mu = 3, xi = 1 km/s), Stage-1 pretraining on
# the Gaussian smooth initial model, 13 shots at 300 m (sources 30 m deep, receivers on
# the surface), 8 Hz, dt 1.9 ms, 1000 samples, all shots per update, Adam lr 1e-4,
# 1000 epochs (smooth initial model). IFWI arm of the paper's comparison (Sec. III-A): 2-D SIREN, 4 x 128, sine,
# omega_0 30, linear output, as in the original IFWI code.
# Not given by the paper: Gaussian sigma (kept at 15 cells as in all residual runs),
# pretraining updates/lr, the distribution of the random core C.
experiment_name: lrpaper13_ifwi
parameterization: absolute
seed: 3
data:
  model_file: vel_marmousi_376x1151.csv
  model_units: m/s
  csv_header: legacy
  downsample: 4
  crop_shape: null
  grid_spacing_m: 15.0
initialization:
  sigma: 15.0
  gaussian_mode: reflect
  gaussian_truncate: 4.0
  # Stage 1 (Sec. II-E): fit the network to the Gaussian initial model before inversion.
  # The paper gives no pretraining updates or lr; these follow pretrain_marmousi.py
  # (original IFWI: Adam 1e-4, 5000 updates, keep the lowest-loss state).
  pretrain:
    updates: 5000
    learning_rate: 0.0001
model:
  neurons: [2, 128, 128, 128, 128, 1]
  omega_0: 30.0
  mean_kmps: 3.0
  std_kmps: 1.0
acquisition:
  num_shots: 13
  source_x_indices: null
  source_start_index: 20
  source_spacing_index: 20
  source_end_margin: 10
  source_depth_index: 2    # Sec. III-A: sources at 30 m
  receiver_depth_index: 0  # Sec. III-A: receivers on the (free) surface
  receiver_stride: 1
forward:
  dt_s: 0.0019
  nt: 1000
  frequency_hz: 8.0
  npad: 15
  order: 2
  free_surface: true
  pml_reflection: 0.000001
training:
  epochs: 1000
  learning_rate: 0.0001
  checkpoint_interval: 50
  shot_batch_size: null
