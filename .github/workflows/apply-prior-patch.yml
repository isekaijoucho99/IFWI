name: Validate and apply exact diffusion-prior patch
on:
  push:
    branches: [feature/lora-diffusion-prior-ifwi]
    paths: ['.pending-prior/**']
permissions:
  contents: write
jobs:
  apply-tested-source:
    if: github.ref == 'refs/heads/feature/lora-diffusion-prior-ifwi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy scipy pandas matplotlib scikit-image pytest pyyaml tqdm
      - name: Verify and apply the locally tested patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          parts = sorted(Path('.pending-prior').glob('part-*.b64'))
          assert len(parts) == 6, 'Missing patch parts'
          raw = lzma.decompress(base64.b64decode(''.join(p.read_text() for p in parts), validate=True))
          assert hashlib.sha256(raw).hexdigest() == '72e0be0e585fbe7c8190babb9934c58f02ff880ee9e7ce2af99245589a3c122f', 'Patch checksum mismatch'
          Path('/tmp/diffusion-prior.patch').write_bytes(raw)
          PY
          git apply --check --index /tmp/diffusion-prior.patch
          git apply --index /tmp/diffusion-prior.patch
      - name: Numerical, integration and resume tests
        run: |
          python -m pytest -q verification/diffusion_prior
          python -m compileall -q experiments/diffusion_prior verification/diffusion_prior core_runner.py
          git diff --cached --check
      - name: Commit validated source only to the experiment branch
        shell: bash
        run: |
          # Workflow changes are finalized through the authenticated connector.
          git restore --staged --worktree .github/workflows/diffusion-prior.yml
          git rm -r .pending-prior
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add tested patch diffusion priors and offline LoRA adaptation'
          git push origin HEAD:refs/heads/feature/lora-diffusion-prior-ifwi
          git archive --format=zip --output=/tmp/ifwi-validated-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ifwi-validated-source
          path: /tmp/ifwi-validated-source.zip
          retention-days: 3
